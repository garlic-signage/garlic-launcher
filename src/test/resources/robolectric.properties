# For every Robolectric test: no real "su" on the machine that runs the tests.
# The shadows need the shadowed classes instrumented by Robolectric. Only these two:
# JaCoCo does not count classes instrumented by Robolectric.
shadows=com.sagiadinos.garlic.launcher.testutil.ShadowShellExecute,com.sagiadinos.garlic.launcher.testutil.ShadowRootChecker
instrumentedPackages=com.sagiadinos.garlic.launcher.helper.ShellExecute,com.sagiadinos.garlic.launcher.helper.RootChecker
