# Robolectric brings AndroidX test libraries into the unit tests
android.useAndroidX=true

# Base version of the launcher (X.Y.Z, optional suffix like -rc1). The build server adds the commit count as build number:
# ./gradlew assembleGarlicLauncherRelease -PbuildNumber=$(git rev-list --count HEAD)
# versionName becomes v<launcherVersion>.<buildNumber>, versionCode the build number.
launcherVersion=1.0.0
