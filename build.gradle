buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.3'
    }
}

plugins {
    id 'org.cyclonedx.bom' version '3.6.1'
}

apply plugin: 'com.android.application'

repositories {
    google()
    mavenCentral()
}

android {
    namespace = "com.sagiadinos.garlic.launcher"
    compileSdk {
        version = release(37) {
            minorApiLevel = 1
        }
    }
    sourceSets { main { java.srcDirs = ['src/main/java', 'src/main/java/Utilis'] } }
    defaultConfig {
        applicationId "com.sagiadinos.garlic.launcher"
        minSdk = 25
        // version: base from gradle.properties, build number from the build server (see there); local builds get 1
        def buildNumber = (project.findProperty('buildNumber') ?: '1') as int
        versionCode = buildNumber
        versionName = "v${project.property('launcherVersion')}.${buildNumber}"
    }
    signingConfigs {
        // For singing keystore.properties includes the credentials
        // but is not uploaded in git
        if (project.rootProject.file('keystore.properties').exists()) {
            release {
                def keystorePropertiesFile = rootProject.file("keystore.properties")
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

                // only release versions should be signed
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }
    buildFeatures {
        buildConfig = true
    }
    testOptions {
        // Robolectric needs the merged manifest and the resources
        unitTests.includeAndroidResources = true
        unitTests.all {
            useJUnitPlatform()
            // count classes loaded by the Robolectric class loader in the coverage
            jacoco {
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
            }
        }
    }
    buildTypes {
        release {
            if (project.rootProject.file('keystore.properties').exists()) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            enableUnitTestCoverage = true
        }
    }

    flavorDimensions = ["brandings"]
    productFlavors {
        GarlicLauncher {
            dimension = "brandings"
            manifestPlaceholders = [
                    appIcon: "@drawable/ic_garlic_launcher"
            ]
        }
        DS_DE {
                dimension = "brandings"
                manifestPlaceholders = [
                       appIcon: "@drawable/ic_ds_logo_mobile"
                ]
        }
    }
}

dependencies {
    implementation 'org.jetbrains:annotations-java5:24.1.0'
    testImplementation('org.junit.jupiter:junit-jupiter:5.10.2')
    testImplementation 'org.mockito:mockito-core:5.11.0'
    // Robolectric runs on JUnit 4 only; the vintage engine runs those tests on the JUnit Platform
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.10.2'
    implementation 'com.android.support:support-annotations:28.0.0'
}

// activate warnings to check if deprecated API commands are used
/*
allprojects {
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
    }
}

 */

// SBOM (CycloneDX JSON) of the release build, for the CRA: ./gradlew cyclonedxDirectBom
// writes build/reports/sbom/garlic-launcher.cdx.json. Attach it to every release.
tasks.named('cyclonedxDirectBom') {
    includeConfigs = ['GarlicLauncherReleaseRuntimeClasspath']
    projectType = org.cyclonedx.model.Component.Type.APPLICATION
    jsonOutput = layout.buildDirectory.file('reports/sbom/garlic-launcher.cdx.json')
    xmlOutput.convention((org.gradle.api.file.RegularFile) null)
}
